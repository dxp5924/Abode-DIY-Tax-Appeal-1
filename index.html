<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#132c2c" />
  <title>Abode Appeal - Broward County DIY MVP</title>
  <style>
    :root{
      --ink:#142322;
      --ink-2:#314644;
      --muted:#687a77;
      --forest:#173f3b;
      --forest-2:#235952;
      --mint:#dcefe7;
      --mint-2:#eef8f3;
      --cream:#f7f4ed;
      --paper:#fffdf8;
      --white:#ffffff;
      --coral:#f47f61;
      --coral-dark:#cd5e43;
      --gold:#d8a33e;
      --green:#1c805f;
      --green-soft:#e7f6ef;
      --orange-soft:#fff3e7;
      --red:#b84242;
      --red-soft:#fff0ef;
      --blue:#356ca7;
      --blue-soft:#edf5ff;
      --line:#dfe6e1;
      --shadow:0 18px 50px rgba(22,58,54,.10);
      --shadow-sm:0 8px 24px rgba(22,58,54,.08);
      --radius:22px;
      --radius-sm:14px;
      --max:1180px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      background:
        radial-gradient(circle at 10% 0%, rgba(220,239,231,.8), transparent 26rem),
        radial-gradient(circle at 94% 18%, rgba(244,127,97,.12), transparent 24rem),
        var(--cream);
      color:var(--ink);
      font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height:1.45;
      min-height:100vh;
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:inherit}
    .app-shell{min-height:100vh}
    .topbar{
      position:sticky;
      top:0;
      z-index:40;
      border-bottom:1px solid rgba(223,230,225,.85);
      background:rgba(247,244,237,.90);
      backdrop-filter:blur(16px);
    }
    .topbar-inner{
      max-width:var(--max);
      margin:0 auto;
      min-height:76px;
      padding:12px 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:18px;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-mark{
      width:42px;height:42px;border-radius:14px;
      background:var(--forest);
      display:grid;place-items:center;color:white;
      box-shadow:0 8px 18px rgba(23,63,59,.2);
      flex:0 0 auto;
    }
    .brand-name{font-weight:850;letter-spacing:-.03em;font-size:18px;white-space:nowrap}
    .brand-sub{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap}
    .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .mode-switch{
      display:flex;gap:3px;padding:4px;border-radius:13px;background:#e9ece7;border:1px solid #dce2dc;
    }
    .mode-btn{
      border:0;background:transparent;color:var(--muted);padding:8px 13px;border-radius:9px;font-size:13px;font-weight:750;
    }
    .mode-btn.active{background:var(--white);color:var(--forest);box-shadow:0 2px 9px rgba(22,58,54,.11)}
    .demo-badge{
      display:inline-flex;align-items:center;gap:7px;
      padding:8px 11px;border-radius:999px;background:var(--orange-soft);color:#815221;
      font-size:12px;font-weight:760;border:1px solid #f3d5b3;
    }
    .pulse{width:7px;height:7px;background:var(--coral);border-radius:50%;box-shadow:0 0 0 4px rgba(244,127,97,.15)}
    .icon-btn{
      width:38px;height:38px;border:1px solid var(--line);background:var(--white);border-radius:12px;
      display:grid;place-items:center;color:var(--ink-2);
    }
    .container{max-width:var(--max);margin:0 auto;padding:34px 24px 90px}
    .lookup-wrap{max-width:1040px;margin:0 auto;padding-top:24px}
    .lookup-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:26px;align-items:stretch}
    .hero-panel{
      border-radius:32px;background:var(--forest);color:white;padding:48px;
      position:relative;overflow:hidden;box-shadow:var(--shadow);
      min-height:570px;display:flex;flex-direction:column;justify-content:space-between;
    }
    .hero-panel:before,.hero-panel:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
    .hero-panel:before{width:330px;height:330px;right:-120px;top:-130px;background:rgba(220,239,231,.12)}
    .hero-panel:after{width:240px;height:240px;left:-110px;bottom:-130px;background:rgba(244,127,97,.15)}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;font-weight:850;color:var(--coral);margin-bottom:14px}
    .hero-panel .eyebrow{color:#f6aa95}
    h1,h2,h3,h4,p{margin-top:0}
    h1{font-size:clamp(38px,5vw,64px);line-height:1.02;letter-spacing:-.055em;margin-bottom:20px}
    h2{font-size:clamp(28px,3vw,40px);line-height:1.08;letter-spacing:-.04em;margin-bottom:12px}
    h3{font-size:20px;line-height:1.2;letter-spacing:-.025em;margin-bottom:8px}
    h4{font-size:15px;line-height:1.25;margin-bottom:6px}
    .hero-copy{font-size:18px;line-height:1.6;color:rgba(255,255,255,.78);max-width:590px}
    .hero-proof{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .proof-cell{padding:16px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11)}
    .proof-value{font-weight:850;font-size:20px;letter-spacing:-.02em}
    .proof-label{font-size:12px;color:rgba(255,255,255,.65);margin-top:3px}
    .lookup-card{background:var(--paper);border:1px solid var(--line);border-radius:30px;padding:34px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
    .account-chip{display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:15px;background:var(--mint-2);margin:8px 0 24px}
    .avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--mint);color:var(--forest);font-weight:850}
    .small{font-size:12px;color:var(--muted)}
    .label{font-size:13px;font-weight:800;color:var(--ink-2);display:block;margin-bottom:7px}
    .req{color:var(--red);font-weight:900;margin-left:2px}
    .field{margin-bottom:16px}
    .input-wrap{position:relative}
    input,select,textarea{
      width:100%;border:1px solid #ccd8d2;background:white;color:var(--ink);
      border-radius:13px;padding:13px 14px;outline:none;transition:.16s border,.16s box-shadow;
    }
    input::placeholder,textarea::placeholder{font-style:italic;color:#95a5a1}
    input:focus,select:focus,textarea:focus{border-color:var(--forest-2);box-shadow:0 0 0 4px rgba(35,89,82,.10)}
    input[readonly]{background:#f3f5f2;color:#526460}
    textarea{min-height:105px;resize:vertical}
    .field-help{font-size:12px;color:var(--muted);margin-top:7px}
    .btn{
      border:1px solid transparent;border-radius:13px;padding:12px 17px;font-weight:820;
      display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:.18s transform,.18s background,.18s border,.18s box-shadow;
    }
    .btn:hover{transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn-primary{background:var(--coral);color:#2c201c;box-shadow:0 8px 18px rgba(244,127,97,.25)}
    .btn-primary:hover{background:#fa8b6e}
    .btn-forest{background:var(--forest);color:white;box-shadow:0 8px 18px rgba(23,63,59,.18)}
    .btn-secondary{background:white;border-color:#cad6d0;color:var(--forest)}
    .btn-soft{background:var(--mint-2);color:var(--forest);border-color:#cfe3da}
    .btn-danger-soft{background:var(--red-soft);color:var(--red);border-color:#f0c8c4}
    .btn-sm{padding:8px 11px;border-radius:10px;font-size:12px}
    .btn-block{width:100%}
    .or-line{display:flex;align-items:center;gap:11px;color:var(--muted);font-size:12px;margin:15px 0}
    .or-line:before,.or-line:after{content:"";height:1px;background:var(--line);flex:1}
    .micro-disclaimer{font-size:11px;line-height:1.45;color:var(--muted);margin-top:auto;padding-top:20px}
    .county-map{
      height:170px;border-radius:18px;overflow:hidden;position:relative;background:#dcefe7;margin-top:18px;border:1px solid #cfe0d8;
    }
    .map-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(23,63,59,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(23,63,59,.06) 1px,transparent 1px);background-size:28px 28px}
    .road{position:absolute;height:3px;background:rgba(255,255,255,.85);border-radius:9px;transform-origin:left center}
    .road.r1{width:130%;left:-10%;top:55%;transform:rotate(-8deg)}
    .road.r2{width:80%;left:16%;top:25%;transform:rotate(40deg)}
    .road.r3{width:90%;left:5%;top:76%;transform:rotate(25deg)}
    .coast{position:absolute;width:33%;height:130%;right:-8%;top:-10%;background:#b8d7e5;border-radius:48% 0 0 52%}
    .pin{position:absolute;left:48%;top:42%;width:28px;height:28px;border-radius:50% 50% 50% 0;background:var(--coral);transform:rotate(-45deg);box-shadow:0 5px 12px rgba(0,0,0,.2)}
    .pin:after{content:"";position:absolute;width:10px;height:10px;background:white;border-radius:50%;left:9px;top:9px}
    .map-label{position:absolute;left:16px;bottom:13px;background:rgba(255,255,255,.92);padding:7px 10px;border-radius:9px;font-size:11px;font-weight:760;color:var(--forest)}
    .property-shell{display:grid;grid-template-columns:238px minmax(0,1fr);gap:24px;align-items:start}
    .side-nav{position:sticky;top:100px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow-sm)}
    .side-summary{padding:10px 9px 15px;border-bottom:1px solid var(--line);margin-bottom:10px}
    .side-summary .address{font-size:13px;font-weight:800;line-height:1.35}
    .side-summary .folio{font-size:11px;color:var(--muted);margin-top:4px}
    .nav-item{
      width:100%;border:0;background:transparent;border-radius:12px;padding:11px 10px;color:var(--muted);font-weight:760;font-size:13px;
      display:flex;align-items:center;gap:10px;text-align:left;margin:3px 0;
    }
    .nav-item.active{background:var(--mint-2);color:var(--forest)}
    .nav-item .nav-num{width:23px;height:23px;border-radius:8px;background:#e7ebe7;display:grid;place-items:center;font-size:11px}
    .nav-item.active .nav-num{background:var(--forest);color:white}
    .side-support{margin-top:12px;padding:13px;border-radius:14px;background:var(--forest);color:white}
    .side-support p{font-size:11px;color:rgba(255,255,255,.7);margin:5px 0 10px}
    .main-content{min-width:0}
    .dashboard-hero{
      background:linear-gradient(135deg,var(--forest),#275e57);color:white;border-radius:26px;padding:30px;
      position:relative;overflow:hidden;box-shadow:var(--shadow-sm);margin-bottom:20px;
    }
    .dashboard-hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;right:-70px;top:-130px;background:rgba(255,255,255,.08)}
    .dashboard-hero-row{display:flex;justify-content:space-between;align-items:flex-start;gap:25px;position:relative;z-index:1}
    .dashboard-hero h2{font-size:34px;margin-bottom:9px}
    .dashboard-hero p{color:rgba(255,255,255,.74);margin-bottom:0;max-width:610px}
    .hero-deadline{text-align:right;flex:0 0 auto}
    .hero-deadline .days{font-size:42px;font-weight:900;line-height:1;letter-spacing:-.05em;color:#f7ad98}
    .hero-deadline .caption{font-size:11px;color:rgba(255,255,255,.65);margin-top:5px;text-transform:uppercase;letter-spacing:.08em}
    .progress-wrap{margin-top:25px;position:relative;z-index:1}
    .progress-label{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.68);margin-bottom:7px}
    .progress-track{height:8px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}
    .progress-fill{height:100%;background:var(--coral);border-radius:999px;transition:width .35s ease}
    .grid{display:grid;gap:18px}
    .grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
    .grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:0 5px 18px rgba(22,58,54,.045)}
    .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px}
    .card-head p{margin:4px 0 0;color:var(--muted);font-size:13px}
    .card-icon{width:40px;height:40px;border-radius:13px;background:var(--mint-2);display:grid;place-items:center;color:var(--forest);flex:0 0 auto}
    .stat{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 14px rgba(22,58,54,.04)}
    .stat-label{font-size:12px;color:var(--muted);font-weight:720}
    .stat-value{font-size:27px;font-weight:900;letter-spacing:-.04em;margin:6px 0 3px}
    .stat-sub{font-size:11px;color:var(--muted)}
    .stat-accent{color:var(--green)}
    .section-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:27px 0 13px}
    .section-title h3{margin:0}
    .section-title p{margin:4px 0 0;font-size:13px;color:var(--muted)}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:999px;font-size:11px;font-weight:800}
    .pill-green{background:var(--green-soft);color:var(--green)}
    .pill-orange{background:var(--orange-soft);color:#8a5a22}
    .pill-blue{background:var(--blue-soft);color:var(--blue)}
    .pill-gray{background:#eff1ee;color:#687a77}
    .pill-red{background:var(--red-soft);color:var(--red)}
    .info-row{display:flex;justify-content:space-between;gap:18px;padding:11px 0;border-bottom:1px solid #e8ece8;font-size:13px}
    .info-row:last-child{border-bottom:0;padding-bottom:0}
    .info-row span:first-child{color:var(--muted)}
    .info-row span:last-child{text-align:right;font-weight:760}
    .savings-card{background:linear-gradient(135deg,#ecf8f2,#fdfbf5)}
    .savings-number{font-size:42px;font-weight:920;letter-spacing:-.055em;color:var(--green);margin:8px 0 2px}
    .formula{padding:11px 12px;background:rgba(255,255,255,.75);border:1px solid #d7e7df;border-radius:12px;font-size:11px;color:var(--muted);margin-top:14px}
    .timeline{position:relative;padding-left:31px}
    .timeline:before{content:"";position:absolute;left:11px;top:7px;bottom:10px;width:2px;background:#d6e0da}
    .timeline-item{position:relative;padding:0 0 20px}
    .timeline-item:last-child{padding-bottom:0}
    .timeline-dot{position:absolute;left:-30px;top:2px;width:20px;height:20px;border-radius:50%;background:white;border:2px solid #c6d6cf;display:grid;place-items:center;font-size:9px;font-weight:900;color:var(--muted)}
    .timeline-item.done .timeline-dot{background:var(--green);border-color:var(--green);color:white}
    .timeline-item.current .timeline-dot{background:var(--coral);border-color:var(--coral);color:#2c201c;box-shadow:0 0 0 5px rgba(244,127,97,.14)}
    .timeline-title{font-size:14px;font-weight:820}
    .timeline-copy{font-size:12px;color:var(--muted);margin-top:2px}
    .callout{border-radius:16px;padding:15px 16px;border:1px solid;display:flex;gap:12px;align-items:flex-start}
    .callout + .callout{margin-top:11px}
    .callout-info{background:var(--blue-soft);border-color:#d3e3f5;color:#274f78}
    .callout-warn{background:var(--orange-soft);border-color:#f1d2ad;color:#7a4d19}
    .callout-success{background:var(--green-soft);border-color:#c6e5d7;color:#176447}
    .callout-danger{background:var(--red-soft);border-color:#efc7c3;color:#973838}
    .callout-title{font-size:13px;font-weight:850;margin-bottom:3px}
    .callout-copy{font-size:12px;line-height:1.5;opacity:.9}
    .action-card{display:flex;align-items:center;justify-content:space-between;gap:18px;background:var(--forest);color:white}
    .action-card p{font-size:13px;color:rgba(255,255,255,.72);margin:5px 0 0;max-width:540px}
    .step-card{background:var(--paper);border:1px solid var(--line);border-radius:20px;margin-bottom:14px;overflow:hidden;box-shadow:0 4px 15px rgba(22,58,54,.035)}
    .step-head{padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid var(--line);background:#fbfcf9}
    .step-title{display:flex;align-items:center;gap:12px}
    .step-number{width:34px;height:34px;border-radius:11px;background:var(--forest);color:white;display:grid;place-items:center;font-weight:900;font-size:13px}
    .step-body{padding:21px}
    .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .form-grid .full{grid-column:1/-1}
    .choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .choice{
      border:1px solid #d4ddd8;background:white;border-radius:13px;padding:12px;display:flex;align-items:flex-start;gap:9px;font-size:12px;
    }
    .choice input{width:auto;margin:2px 0 0;accent-color:var(--forest)}
    .choice strong{display:block;font-size:12px;margin-bottom:2px}
    .worksheet{border:1px solid var(--line);border-radius:15px;overflow:hidden}
    .worksheet-row{display:grid;grid-template-columns:180px 1fr auto;gap:13px;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line);font-size:12px}
    .worksheet-row:last-child{border-bottom:0}
    .worksheet-row .k{color:var(--muted)}
    .worksheet-row .v{font-weight:760;min-width:0;overflow-wrap:anywhere}
    .copy-btn{border:0;background:var(--mint-2);color:var(--forest);font-size:11px;font-weight:800;border-radius:8px;padding:6px 8px}
    .document-card{border:1px solid #d8e1dc;background:#fbfcfa;border-radius:15px;padding:14px;display:flex;align-items:center;gap:13px}
    .document-card + .document-card{margin-top:10px}
    .doc-icon{width:42px;height:48px;border-radius:10px;background:var(--mint);display:grid;place-items:center;color:var(--forest);font-weight:900;flex:0 0 auto}
    .doc-meta{min-width:0;flex:1}
    .doc-name{font-size:13px;font-weight:830;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .doc-sub{font-size:11px;color:var(--muted);margin-top:3px}
    .numbered-list{list-style:none;padding:0;margin:0;counter-reset:steps}
    .numbered-list li{counter-increment:steps;display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #e8ece8;font-size:13px}
    .numbered-list li:last-child{border-bottom:0}
    .numbered-list li:before{content:counter(steps);width:24px;height:24px;border-radius:8px;background:var(--mint-2);color:var(--forest);font-size:11px;font-weight:900;display:grid;place-items:center;flex:0 0 auto}
    .portal-card{border:1px solid #cbded5;background:var(--mint-2);border-radius:17px;padding:18px}
    .portal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
    .portal-url{font-size:11px;color:var(--muted);margin:3px 0 0}
    .divider{height:1px;background:var(--line);margin:18px 0}
    .check-row{display:flex;align-items:flex-start;gap:10px;margin:9px 0;font-size:12px}
    .check-row input{width:auto;margin-top:2px;accent-color:var(--forest)}
    .result-panel{text-align:center;padding:34px 20px}
    .result-icon{width:66px;height:66px;border-radius:22px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 15px;font-size:28px;font-weight:900}
    details{border:1px solid var(--line);border-radius:14px;background:white;margin:9px 0;overflow:hidden}
    summary{list-style:none;padding:14px 15px;font-size:13px;font-weight:820;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px}
    summary::-webkit-details-marker{display:none}
    summary:after{content:"+";font-size:18px;color:var(--muted)}
    details[open] summary:after{content:"–"}
    .details-body{padding:0 15px 15px;color:var(--muted);font-size:12px;line-height:1.6}
    .operator-hero{background:var(--forest);color:white;border-radius:30px;padding:38px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:20px}
    .operator-hero:after{content:"";position:absolute;width:340px;height:340px;border-radius:50%;right:-120px;top:-170px;background:rgba(244,127,97,.16)}
    .operator-hero-inner{display:grid;grid-template-columns:1fr 300px;gap:30px;align-items:center;position:relative;z-index:1}
    .operator-hero p{color:rgba(255,255,255,.72);font-size:16px;max-width:700px;margin-bottom:0}
    .score-ring{width:185px;height:185px;border-radius:50%;margin:0 auto;background:conic-gradient(var(--coral) 0 93%,rgba(255,255,255,.13) 93% 100%);display:grid;place-items:center;position:relative}
    .score-ring:before{content:"";position:absolute;inset:13px;background:var(--forest);border-radius:50%}
    .score-inner{position:relative;text-align:center}
    .score-value{font-size:45px;font-weight:920;letter-spacing:-.05em;line-height:1}

<body>
  <div id="app" class="app-shell"></div>

  <script>
  (() => {

    const DEMO_PROPERTIES = [
      {
        id:'ftl-demo', owner:'', address:'410 Harbor Pine Lane, Fort Lauderdale, FL 33301', city:'Fort Lauderdale', county:'Broward County',
        parcel:'5042-11-09-0410', type:'Single-family residence', justValue:615000, assessedValue:615000, exemptions:50000,
        supportedValue:545000, millage:18.5714, lat:'26.122', lng:'-80.137', note:'Synthetic demo property - not a live county parcel.'
      },
      {
        id:'holly-demo', owner:'', address:'2250 Palm Shore Avenue, Hollywood, FL 33020', city:'Hollywood', county:'Broward County',
        parcel:'5142-15-18-0720', type:'Townhome', justValue:492000, assessedValue:492000, exemptions:50000,
        supportedValue:442000, millage:22.0571, lat:'26.011', lng:'-80.149', note:'Synthetic demo property - not a live county parcel.'
      },
      {
        id:'pomp-demo', owner:'', address:'980 Cypress Marina Drive, Pompano Beach, FL 33060', city:'Pompano Beach', county:'Broward County',
        parcel:'4942-01-28-1630', type:'Condominium unit', justValue:388000, assessedValue:388000, exemptions:25000,
        supportedValue:348000, millage:20.3823, lat:'26.237', lng:'-80.125', note:'Synthetic demo property - not a live county parcel.'
      }
    ];

    const DEFAULT_APPEAL = {
      id:'', createdAt:'',
      property:null,
      eligibility:{singleParcel:'yes', appealType:'value', onTime:'yes', ownerMatch:'yes', represented:'no', checked:false},
      appealReasons:['The assessment appears higher than market value'],
      filing:{answersSaved:false, evidenceDownloaded:false, portalOpened:false, transaction:'', filedDate:'', feePaid:false, attested:false, receiptAttached:false, receiptName:'', filed:false},
      hearing:{date:'', time:'', format:'remote', noticeFile:'', noticeRead:false, evidenceUploaded:false, scriptReviewed:false, calendarAdded:false},
      result:{outcome:'', decisionDate:'', finalValue:'', notes:'', closed:false}
    };

    const DEFAULT_STATE = {
      mode:'homeowner',
      homeownerTab:'overview',
      appeals:[],
      activeId:null,
      account:{created:false, owner:'', email:'', phone:'', mailing:'', mailingSame:false},
      support:{package:'DIY Guide', callDate:'', callTime:'', scheduled:false, upgradeRequested:false},

      chatMessages:[
        {from:'bot', text:'Hi there - I can explain your Broward filing steps, deadlines, fees, hearing preparation, and when to escalate. I cannot file, sign, or make a legal conclusion for you.', source:'Verified Broward + Florida guidance'}
      ]
    };

    function activeAppeal(){ return state.appeals.find(a=>a.id===state.activeId)||null; }
    function newAppeal(property){
      const a=structuredClone(DEFAULT_APPEAL);
      a.id='ap-'+Date.now().toString(36)+Math.floor(Math.random()*999);
      a.createdAt=new Date().toISOString();
      a.property=property;
      state.appeals.push(a);
      state.activeId=a.id;
      state.homeownerTab='overview';
      return a;
    }
    function shortAddr(a){ const s=(a&&a.property&&a.property.address)||'New property'; return s.split(',')[0]; }
    // Per-appeal fields are exposed on `state` as live proxies to the active appeal,
    // so the whole workflow reads/writes the right record automatically.
    const APPEAL_FIELDS=['property','eligibility','appealReasons','filing','hearing','result'];
    function attachProxies(st){
      APPEAL_FIELDS.forEach(f=>Object.defineProperty(st,f,{
        configurable:true, enumerable:false,
        get(){ const a=st.appeals.find(x=>x.id===st.activeId); return a?a[f]:(f==='appealReasons'?[]:null); },
        set(v){ const a=st.appeals.find(x=>x.id===st.activeId); if(a)a[f]=v; }
      }));
      return st;
    }

    let state = loadState();

    function loadState(){
      try{
        let saved=null;
        const raw = localStorage.getItem('abodeAppealMvpBrowardV3');
        if(raw){ saved = JSON.parse(raw); }
        else {
          const old = localStorage.getItem('abodeAppealMvpBrowardV2');
          if(old){
            const o=JSON.parse(old);
            saved={mode:o.mode,homeownerTab:o.homeownerTab,account:o.account,support:o.support,chatMessages:o.chatMessages,appeals:[],activeId:null};
            if(o.property){
              const a=structuredClone(DEFAULT_APPEAL);
              a.id='ap-migrated'; a.createdAt=new Date().toISOString();
              a.property=o.property; a.eligibility=o.eligibility||a.eligibility; a.appealReasons=o.appealReasons||a.appealReasons;
              a.filing=o.filing||a.filing; a.hearing=Object.assign({},a.hearing,o.hearing||{}); a.result=o.result||a.result;
              saved.appeals=[a]; saved.activeId=a.id;
            }
          }
        }
        if(!saved) return attachProxies(structuredClone(DEFAULT_STATE));
        const st = deepMerge(structuredClone(DEFAULT_STATE), saved);
        st.appeals=(saved.appeals||[]).map(a=>deepMerge(structuredClone(DEFAULT_APPEAL),a));
        return attachProxies(st);
      } catch(e){ return attachProxies(structuredClone(DEFAULT_STATE)); }
    }
    function deepMerge(target, source){
      if(!source || typeof source !== 'object') return target;
      Object.keys(source).forEach(k => {
        if(source[k] && typeof source[k] === 'object' && !Array.isArray(source[k])){
          target[k] = deepMerge(target[k] || {}, source[k]);
        } else target[k] = source[k];
      });
      return target;
    }
    function saveState(){
      try{ localStorage.setItem('abodeAppealMvpBrowardV3', JSON.stringify(state)); }catch(e){}
    }
    function setPath(path, value){
      const parts = path.split('.'); let cur = state;
      parts.slice(0,-1).forEach(p => { if(!cur[p]) cur[p]={}; cur=cur[p]; });
      cur[parts[parts.length-1]] = value;
      saveState();
    }
    function escapeHTML(v=''){
      return String(v).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
    }
    function money(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number(n)||0)}
    function num(n){return new Intl.NumberFormat('en-US').format(Number(n)||0)}
    function firstName(){return (state.account.owner||'there').trim().split(' ')[0]||'there'}
    function initials(){const parts=(state.account.owner||'A').trim().split(' ');return ((parts[0]||'A')[0]+(parts[1]?parts[1][0]:'')).toUpperCase()}
    function displayDate(v){
      if(!v) return 'Not entered';
      const d = new Date(v+'T12:00:00');
      return new Intl.DateTimeFormat('en-US',{month:'long',day:'numeric',year:'numeric'}).format(d);
    }
    function shortDate(v){
      if(!v) return 'TBD';
      const d = new Date(v+'T12:00:00');
      return new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',year:'numeric'}).format(d);
    }
    function subtractDays(v, days){
      if(!v) return '';
      const d = new Date(v+'T12:00:00'); d.setDate(d.getDate()-days);
      return d.toISOString().slice(0,10);
    }
    function daysToDeadline(){
      const deadline = new Date('2026-09-18T23:59:59');
      const now = new Date();
      return Math.max(0, Math.ceil((deadline-now)/86400000));
    }
    function calcSavings(prop=state.property, finalValue=null){
      if(!prop) return {currentTaxable:0,supportedTaxable:0,reduction:0,savings:0};
      const target = finalValue !== null && finalValue !== '' ? Number(finalValue) : Number(prop.supportedValue);
      const currentTaxable = Math.max(0, Number(prop.assessedValue)-Number(prop.exemptions));
      const supportedTaxable = Math.max(0, target-Number(prop.exemptions));
      const reduction = Math.max(0, currentTaxable-supportedTaxable);
      return {currentTaxable,supportedTaxable,reduction,savings:reduction*Number(prop.millage)/1000};
    }
    function progress(){
      if(state.result.closed) return 100;
      if(state.hearing.evidenceUploaded) return 78;
      if(state.filing.filed) return 58;
      if(state.filing.answersSaved) return 34;
      if(state.eligibility.checked) return 23;
      if(state.property) return 14;
      if(state.account.created) return 6;
      return 0;
    }

      if(!state.filing.filed) return {title:'Submit through Broward County',copy:'Open the official portal, submit the petition yourself, then return with the transaction number and receipt.',tab:'file'};
      if(!state.hearing.evidenceUploaded) return {title:'Prepare for the hearing',copy:'When the county DR-481 notice arrives, enter the hearing date and time, meet the evidence deadline, and complete the checklist.',tab:'hearing'};
      if(!state.result.closed) return {title:'Record the decision',copy:'When Broward sends the result, add it here to close the appeal and confirm estimated savings.',tab:'result'};
      return {title:'Appeal complete',copy:'Your result is recorded. Keep the decision and tax records with your property documents.',tab:'result'};

        <div class="callout callout-info ${!state.filing.filed?'mt-2':''}"><div>${icon('mail',17)}</div><div><div class="callout-title">Action needed from you: enter the date and time from your county notice</div><div class="callout-copy">Broward mails a <strong>Notice of Hearing (Form DR-481)</strong> at least <strong>25 calendar days before your hearing</strong> - value hearings begin in October, weekdays 8:30 am - 4:30 pm. Abode cannot see the county's schedule for you (we never hold your county portal login), so when the notice arrives, enter the <strong>date and time</strong> below and upload the notice for your records. Everything else - the evidence deadline, calendar invites, and your script - is calculated from it. No notice yet? Check "Petition Status" on the portal with your transaction number and password.</div></div></div>

          <div class="stat"><div class="stat-label">Hearing time</div><div class="stat-value" style="font-size:20px">${escapeHTML(timeLabel)}</div><div class="stat-sub">From your DR-481 notice</div></div>
          <div class="stat"><div class="stat-label">Evidence due</div><div class="stat-value stat-accent" style="font-size:20px">${shortDate(due)}</div><div class="stat-sub">15 days before the hearing</div></div>
          <div class="stat"><div class="stat-label">Format</div><div class="stat-value" style="font-size:20px;text-transform:capitalize">${escapeHTML(state.hearing.format)}</div><div class="stat-sub">Confirm against the notice</div></div>

    function formatTime(t){
      if(!t) return '';
      const [h,m]=t.split(':').map(Number);
      const ampm=h>=12?'PM':'AM'; const hh=((h+11)%12)+1;
      return `${hh}:${String(m).padStart(2,'0')} ${ampm}`;
    }

    function personalScript(){
      const p=state.property; if(!p) return '';
      const s=calcSavings();
      const reasonLines={
        'The assessment appears higher than market value':'The county\'s just value of '+money(p.justValue)+' exceeds what the market evidence supports for this property as of January 1.',
        'Comparable sales support a lower value':'Exhibits A through C are closed sales near '+p.address.split(',')[0]+'; adjusted, they indicate a market value of about '+money(p.supportedValue)+'.',
        'Property facts are inaccurate':'The property record contains factual errors (size, features, or condition data) that inflate the assessment; the corrected facts are documented in the evidence package.',
        'Condition or damage is not reflected':'Documented condition issues, included in the evidence package, were not reflected in the assessment and reduce the market value.'
      };
      const formatTip={
        'remote':'Format tip: you chose a remote hearing - test your video link and audio 10 minutes early, and have the evidence package open on screen.',
        'phone':'Format tip: you chose a telephone hearing - call from a quiet room and keep the printed evidence package in front of you with exhibits tabbed.',
        'in-person':'Format tip: you chose in person - arrive early at the hearing location on your notice, bring two printed copies of the evidence package, and have your transaction number handy.'
      };
      const when=state.hearing.date?('My hearing is '+shortDate(state.hearing.date)+(state.hearing.time?' at '+formatTime(state.hearing.time):'')+'. '):'';
      return 'OPENING\n"Good morning. I am '+state.account.owner+', the owner of '+p.address+', folio '+p.parcel+'. I am asking the Board to reduce the January 1 market value from '+money(p.justValue)+' to '+money(p.supportedValue)+' based on the evidence submitted."\n\nYOUR REASONS (from your worksheet)\n'+(state.appealReasons.length?state.appealReasons.map((r,i)=>(i+1)+'. '+(reasonLines[r]||r)).join('\n'):'Select at least one appeal reason in the File tab to build this section.')+'\n\nCLOSING\n"For these reasons, the evidence supports a market value of '+money(p.supportedValue)+', a reduction of '+money(Number(p.justValue)-Number(p.supportedValue))+'. I respectfully request the Board adopt that value. Thank you."\n\n'+when+(formatTip[state.hearing.format]||'')+'\nEstimated annual tax impact if granted: about '+money(s.savings)+' (estimate only).';
    }

    function renderResult(){
      const p=state.property;

      const s=calcSavings(p,final);

    function createPropertyFromInput(input){
      const exact=DEMO_PROPERTIES.find(p=>p.address.toLowerCase()===input.toLowerCase());
      if(exact){const c=structuredClone(exact);c.owner=state.account.owner;return c;}
      const lower=input.toLowerCase();
      let city='Fort Lauderdale', millage=18.5714;
      if(lower.includes('hollywood')){city='Hollywood';millage=22.0571}
      else if(lower.includes('pompano')){city='Pompano Beach';millage=20.4018}
      else if(lower.includes('plantation')){city='Plantation';millage=20.0675}
      let hash=0; for(let i=0;i<input.length;i++) hash=((hash<<5)-hash)+input.charCodeAt(i),hash|=0;
      const base=460000+(Math.abs(hash)%260000);
      const gap=40000+(Math.abs(hash)%45000);
      return {id:'generated',owner:state.account.owner,address:input,city,county:'Broward County',parcel:`50${String(Math.abs(hash)%10000).padStart(4,'0')}-${String(Math.abs(hash)%99).padStart(2,'0')}-${String(Math.abs(hash*3)%99).padStart(2,'0')}-${String(Math.abs(hash*7)%9999).padStart(4,'0')}`,type:'Single-family residence',justValue:base,assessedValue:base,exemptions:50000,supportedValue:base-gap,millage,lat:'26.12',lng:'-80.14',note:'Generated synthetic record - production would verify against Broward County parcel data.'};
    }

    function legacyCopy(text){
      const ta=document.createElement('textarea');
      ta.value=text; ta.setAttribute('readonly','');
      ta.style.position='fixed'; ta.style.opacity='0'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length);
      let ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
      ta.remove();
      showToast(ok?'Copied to clipboard':'Copy failed - select the text and copy manually');
    }
    function copyText(text){
      if(navigator.clipboard && window.isSecureContext){

      } else legacyCopy(text);
    }

        newAppeal(createPropertyFromInput(val));saveState();render();showToast('Property mapped to Broward County');
      }
      else if(action==='add-property'||action==='change-property'){state.activeId=null;state.homeownerTab='overview';saveState();render();window.scrollTo({top:0,behavior:'smooth'});}
      else if(action==='switch-appeal'){state.activeId=a.dataset.id;state.homeownerTab='overview';saveState();render();window.scrollTo({top:0,behavior:'smooth'});}
      else if(action==='replace-receipt'){state.filing.receiptAttached=false;state.filing.receiptName='';saveState();render();}
      else if(action==='replace-notice'){state.hearing.noticeFile='';saveState();render();}
      else if(action==='fill-demo-notice'){state.hearing.date='2026-11-12';state.hearing.time='10:30';state.hearing.format='remote';state.hearing.noticeFile='DR-481_Notice_demo.pdf';saveState();render();showToast('Demo DR-481 notice applied');}
      else if(action==='copy-script'){copyText(personalScript());}
      else if(action==='set-tab'){state.homeownerTab=a.dataset.tab;saveState();render();window.scrollTo({top:0,behavior:'smooth'});}
      else if(action==='check-eligibility'){state.eligibility.checked=true;saveState();render();showToast(eligibilityIssues().length?'Exception route identified':'Standard DIY path confirmed');}
      else if(action==='save-filing-answers'){
        if(!state.account.owner.trim()||!state.account.email.trim()||!state.account.phone.trim()||!(state.account.mailing||'').trim()){showToast('Complete all required worksheet fields, including mailing address');return}
        if(state.account.mailingSame && state.property && state.account.mailing.trim().toLowerCase()!==state.property.address.trim().toLowerCase()){showToast('Mailing address must match the property address while "same as property" is checked');return}
        if(!state.appealReasons.length){showToast('Select at least one appeal reason');return}
        state.filing.answersSaved=true;saveState();render();showToast('Filing worksheet marked as reviewed');
      }
      else if(action==='copy-text'){copyText(a.dataset.copy||'');}
      else if(action==='copy-worksheet'){copyText(worksheetText());}
      else if(action==='download-evidence'){downloadEvidence();}
      else if(action==='open-portal'){state.filing.portalOpened=true;saveState();setTimeout(render,100);}
      else if(action==='fill-demo-confirmation'){state.filing.transaction='2026-014823';state.filing.filedDate=new Date().toISOString().slice(0,10);state.filing.feePaid=true;state.filing.attested=true;state.filing.receiptAttached=true;state.filing.receiptName='VAB_receipt_demo.pdf';saveState();render();}
      else if(action==='mark-filed'){
        const pr=prereq();
        if(!pr.allOk){
          const names=['confirm the filing path (step 1)','review the worksheet (step 2)','download the documents (step 3)','open the county portal (step 4)'];
          showToast('First: '+names.filter((_,i)=>!pr.list[i]).join(', '));return;
        }
        if(!state.filing.transaction.trim()||!state.filing.filedDate||!state.filing.feePaid||!state.filing.attested||!state.filing.receiptAttached){showToast('All fields are required: transaction, date, receipt attachment, fee, and attestation');return}
        if((state.filing.transaction.match(/\d/g)||[]).length<6){showToast('The county transaction number should contain at least six digits (e.g., 2026-014823)');return}
        state.filing.filed=true;saveState();render();showToast('Petition marked as filed');
      }
      else if(action==='download-calendar'){downloadCalendar();}
      else if(action==='export-record'){exportRecordCSV();}
      else if(action==='record-result'){
        if(!state.result.outcome||!state.result.decisionDate||!state.result.finalValue){showToast('Add the outcome, decision date, and final value');return}
        state.result.closed=true;saveState();render();showToast('Appeal result recorded');
      }
      else if(action==='toggle-chat'){state.chatOpen=!state.chatOpen;saveState();renderChat();}
      else if(action==='chat-question'){sendChat(a.dataset.question||'');}
      else if(action==='send-chat'){const i=document.getElementById('chatInput');sendChat(i?i.value:'');}
      else if(action==='ask-hearing-chat'){state.chatOpen=true;sendChat('Help me prepare for the hearing');}
      else if(action==='open-support'){state.modalOpen=true;saveState();renderModal();}
      else if(action==='close-support'){state.modalOpen=false;saveState();renderModal();}
      else if(action==='select-package'){state.support.package=a.dataset.package;state.support.scheduled=false;state.support.upgradeRequested=false;saveState();renderModal();}
      else if(action==='schedule-call'){if(!state.support.callDate||!state.support.callTime){showToast('Choose a date and time');return}state.support.scheduled=true;saveState();renderModal();showToast('Call request saved');}
      else if(action==='request-upgrade'){state.support.upgradeRequested=true;saveState();renderModal();showToast('Full-service eligibility request saved');}
      else if(action==='scroll-section'){const el=document.getElementById(a.dataset.section);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
    });

    document.addEventListener('input', e=>{
      const el=e.target;
      if(el.dataset.bind && el.type!=='checkbox' && el.tagName!=='SELECT') setPath(el.dataset.bind,el.value);
    });

    document.addEventListener('change', e=>{
      const el=e.target;
      if(el.dataset.actionCheck==='toggle-mailing-same'){
        state.account.mailingSame=el.checked;
        if(el.checked && state.property) state.account.mailing=state.property.address;
        saveState();render();
        return;
      }
      if(el.id==='noticeInput'){
        const f=el.files&&el.files[0];
        state.hearing.noticeFile=f?f.name:'';
        saveState();render();
        if(f)showToast('Notice attached - now enter the date and time from it');
        return;
      }
      if(el.id==='receiptInput'){
        const f=el.files&&el.files[0];
        state.filing.receiptAttached=!!f;
        state.filing.receiptName=f?f.name:'';
        saveState();render();
        if(f)showToast('Receipt attached (name recorded, file not stored)');
        return;
      }
      if(el.dataset.bind){
        const value=el.type==='checkbox'?el.checked:el.value;
        setPath(el.dataset.bind,value);
        if(el.dataset.bind.startsWith('hearing.')) setTimeout(render,0);
        else if(el.dataset.bind.startsWith('eligibility.')){state.eligibility.checked=false;saveState();}
      }
      if(el.dataset.reason){
        if(el.checked&&!state.appealReasons.includes(el.dataset.reason))state.appealReasons.push(el.dataset.reason);
        if(!el.checked)state.appealReasons=state.appealReasons.filter(x=>x!==el.dataset.reason);
        saveState();render();
      }
    });
    document.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&e.target.id==='addressInput'){e.preventDefault();document.querySelector('[data-action="search-property"]')?.click();}
      if(e.key==='Enter'&&e.target.id==='chatInput'){e.preventDefault();document.querySelector('[data-action="send-chat"]')?.click();}
      if(e.key==='Escape'){state.chatOpen=false;state.modalOpen=false;saveState();renderChat();renderModal();}
    });
    document.getElementById('supportModal').addEventListener('click',(e)=>{if(e.target===e.currentTarget){state.modalOpen=false;saveState();renderModal();}});

    render();
  })();
  </script>
</body>
</html>
